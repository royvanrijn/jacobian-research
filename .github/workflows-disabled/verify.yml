name: verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    name: verify-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            timeout: 45
          - suite: theorems
            timeout: 120
          - suite: regressions
            timeout: 45
          - suite: derived
            timeout: 45

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install system CAS dependencies
        if: ${{ matrix.suite == 'theorems' || matrix.suite == 'regressions' || matrix.suite == 'derived' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends singular
      - name: Install pinned dependencies
        run: python -m pip install --requirement research/requirements.txt
      - name: Record environment
        run: |
          mkdir -p research/artifacts/verification
          python research/scripts/record_environment.py | tee research/artifacts/verification/environment-${{ matrix.suite }}.txt
      - name: Check repository and run suite
        shell: bash
        run: |
          set -o pipefail
          make PYTHON=python SYSTEM_PYTHON=python check verify-${{ matrix.suite }} 2>&1 | tee research/artifacts/verification/verify-${{ matrix.suite }}.log
      - name: Audit finite-etale Keller fibers
        if: ${{ matrix.suite == 'theorems' }}
        run: python research/scripts/verify_finite_etale_keller_fibers.py
      - name: Archive verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.suite }}-${{ github.sha }}
          path: research/artifacts/verification/
          if-no-files-found: error
          retention-days: 14

  jc72_108:
    name: jc72-108-closure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install exact replay dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends singular
          python -m pip install --requirement research/requirements.txt
      - name: Replay the finite Proposition-4.3 and quotient-first audits
        shell: bash
        run: |
          mkdir -p research/artifacts/verification
          set -euo pipefail
          python research/plane-jc/cas/verify_prop43_exhaustiveness.py | tee research/artifacts/verification/jc72-108-prop43.log
          grep -q '^PROP43_EXHAUSTIVENESS_AUDIT_PASS$' research/artifacts/verification/jc72-108-prop43.log
          python research/plane-jc/cas/verify_prime_defect_tail.py | tee research/artifacts/verification/jc72-108-prime-defect.log
          grep -q '^PRIME_DEFECT_TAIL_PASS$' research/artifacts/verification/jc72-108-prime-defect.log
          python research/plane-jc/cas/verify_mu7_quotient_firstblock.py | tee research/artifacts/verification/jc72-108-mu7.log
          grep -q '^MU7_QUOTIENT_FIRSTBLOCK_PASS$' research/artifacts/verification/jc72-108-mu7.log
          python research/plane-jc/cas/research_72_108_gap_attack.py | tee research/artifacts/verification/jc72-108-structure.log
          grep -q '^STRUCTURAL_GAP_ATTACK_PASS$' research/artifacts/verification/jc72-108-structure.log
          python research/plane-jc/cas/verify_firstblock_quotient_graph.py | tee research/artifacts/verification/jc72-108-quotient-graph.log
          grep -q '^QUOTIENT_GRAPH_EXACT_PASS$' research/artifacts/verification/jc72-108-quotient-graph.log
      - name: Verify exact transport between the two Case-1 sign branches
        shell: bash
        run: |
          set -euo pipefail
          python research/plane-jc/cas/verify_case1_branch_symmetry.py | tee research/artifacts/verification/jc72-108-branch-symmetry.log
          grep -q '^CASE1_BRANCH_SYMMETRY_PASS$' research/artifacts/verification/jc72-108-branch-symmetry.log
      - name: Replay the characteristic-zero Case-1 determinantal closure
        shell: bash
        run: |
          set -euo pipefail
          python research/scripts/research_jc72_108_case1_rankdrop.py /tmp/case1-exact.sing | tee research/artifacts/verification/jc72-108-case1-generate.log
          grep -q '^CASE1_RECONSTRUCTION_PASS$' research/artifacts/verification/jc72-108-case1-generate.log
          grep -q '^CASE1_SPECIAL_FIBRE_PYTHON_PASS$' research/artifacts/verification/jc72-108-case1-generate.log
          Singular -q /tmp/case1-exact.sing | tee research/artifacts/verification/jc72-108-case1-exact.log
          grep -q '^CASE1_SPECIAL_FIBRE_BEZOUT_PASS$' research/artifacts/verification/jc72-108-case1-exact.log
          grep -q '^CASE1_N_MOD_H_PASS$' research/artifacts/verification/jc72-108-case1-exact.log
          grep -q '^RANKDROP_EXACT_UNIT_PASS$' research/artifacts/verification/jc72-108-case1-exact.log
      - name: Replay the explicit good-prime syzygy regression
        shell: bash
        run: |
          set -euo pipefail
          python research/scripts/research_jc72_108_case1_rankdrop.py /tmp/case1-p71.sing --prime 71 --lift | tee research/artifacts/verification/jc72-108-p71-generate.log
          Singular -q /tmp/case1-p71.sing | tee research/artifacts/verification/jc72-108-p71.log
          grep -q '^RANKDROP_UNIT_IDENTITY_PASS$' research/artifacts/verification/jc72-108-p71.log
          grep -q '^CASE1_H_DETERMINANTAL_PASS$' research/artifacts/verification/jc72-108-p71.log
      - name: Archive the JC72-108 replay logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jc72-108-closure-${{ github.sha }}
          path: research/artifacts/verification/jc72-108-*.log
          if-no-files-found: error
          retention-days: 14

  formal-lean:
    name: formal-lean
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out the pinned external Lean certificate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: deancureton/jacobian
          ref: 0d4a9212d874226ad81ce5a926becddfa94e6a88
          path: .cache/lean-foundational
          persist-credentials: false
      - name: Prepare the stable Lean and Mathlib overlay
        run: bash research/scripts/verify_lean_foundational_map.sh --prepare-only
      - name: Install Lean and prime the Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: .cache/lean-foundational-stable
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Reproduce the repository formal-verification target
        shell: bash
        run: |
          mkdir -p research/artifacts/verification
          set -o pipefail
          make verify-lean-foundational 2>&1 | tee research/artifacts/verification/formal-lean.log
      - name: Archive formal-verification log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-lean-${{ github.sha }}
          path: research/artifacts/verification/formal-lean.log
          if-no-files-found: error
          retention-days: 14

  formal_local_lean:
    name: formal-local-lean
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Audit Lean placeholders and explicit axioms
        run: python3 research/scripts/check_lean_placeholders.py
      - name: Enforce the paper certificate import boundary
        run: python3 research/scripts/check_paper_certificate_imports.py
      - name: Install Lean and prime the Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: research/formal/finite-etale-keller
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build and log the finite-etale fibers paper certificate
        shell: bash
        run: |
          mkdir -p research/artifacts/verification
          set -euo pipefail
          cd research/formal/finite-etale-keller
          "$HOME/.elan/bin/lake" build \
            FiniteEtaleKeller.PaperCertificate \
            2>&1 | tee ../../artifacts/verification/paper-certificate.log
      - name: Audit finite-etale fibers theorem axiom reports
        run: >-
          python3 research/scripts/check_lean_axiom_log.py fibers
          research/artifacts/verification/paper-certificate.log
      - name: Build and log the fixed-map Hasse paper certificate
        shell: bash
        run: |
          set -euo pipefail
          cd research/formal/finite-etale-keller
          "$HOME/.elan/bin/lake" build \
            FiniteEtaleKeller.FixedHassePaperCertificate \
            2>&1 | tee ../../artifacts/verification/fixed-hasse-paper-certificate.log
      - name: Audit fixed-map Hasse theorem axiom reports
        run: >-
          python3 research/scripts/check_lean_axiom_log.py fixed-hasse
          research/artifacts/verification/fixed-hasse-paper-certificate.log
      - name: Build every checked-in Lean project
        shell: bash
        run: |
          set -o pipefail
          make verify-lean-local 2>&1 |
            tee research/artifacts/verification/local-lean-projects.log
      - name: Archive finite-etale Lean logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-local-lean-${{ github.sha }}
          path: |
            research/artifacts/verification/paper-certificate.log
            research/artifacts/verification/fixed-hasse-paper-certificate.log
            research/artifacts/verification/local-lean-projects.log
          if-no-files-found: error
          retention-days: 14

  papers:
    name: papers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cm-super latexmk texlive-fonts-recommended texlive-latex-extra
      - name: Build finalized and active papers
        shell: bash
        run: |
          mkdir -p research/artifacts/verification
          set -o pipefail
          make verify-papers 2>&1 | tee research/artifacts/verification/papers.log
      - name: Reject unresolved references in the active papers
        run: |
          python research/scripts/check_latex_log.py research/papers/common-arithmetic-fibers/main.log
          python research/scripts/check_latex_log.py research/papers/fixed-map-hasse-failures/main.log
      - name: Archive paper build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-build-log-${{ github.sha }}
          path: research/artifacts/verification/papers.log
          if-no-files-found: error
          retention-days: 14
      - name: Archive compiled papers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: papers-${{ github.sha }}
          path: |
            research/papers/gaussian-moments-two-variables/main.pdf
            research/papers/sparse-minimality-gaussian-moments-dimension-three/main.pdf
            research/papers/common-arithmetic-fibers/main.pdf
            research/papers/fixed-map-hasse-failures/main.pdf
          if-no-files-found: error
          retention-days: 14

  macaulay2:
    name: macaulay2-independent-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd

    steps:
      - name: Install the pinned Macaulay2 package
        run: |
          apt-get update -qq
          apt-get install -qq --yes --no-install-recommends \
            ca-certificates git make macaulay2=1.24.11+ds-5+b1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run the pinned Macaulay2 comparison
        shell: bash
        run: |
          mkdir -p research/artifacts/verification
          set -o pipefail
          make verify-coincident-root-loci 2>&1 | tee research/artifacts/verification/macaulay2.log
      - name: Archive Macaulay2 log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macaulay2-${{ github.sha }}
          path: research/artifacts/verification/macaulay2.log
          if-no-files-found: error
          retention-days: 14

  verification-complete:
    name: verification-complete
    if: ${{ always() }}
    needs: [verify, jc72_108, formal-lean, formal_local_lean, papers, macaulay2]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every verification layer
        env:
          PYTHON_RESULT: ${{ needs.verify.result }}
          JC72_RESULT: ${{ needs.jc72_108.result }}
          LEAN_RESULT: ${{ needs.formal-lean.result }}
          LOCAL_LEAN_RESULT: ${{ needs.formal_local_lean.result }}
          PAPERS_RESULT: ${{ needs.papers.result }}
          MACAULAY2_RESULT: ${{ needs.macaulay2.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$JC72_RESULT" = success
          test "$LEAN_RESULT" = success
          test "$LOCAL_LEAN_RESULT" = success
          test "$PAPERS_RESULT" = success
          test "$MACAULAY2_RESULT" = success
