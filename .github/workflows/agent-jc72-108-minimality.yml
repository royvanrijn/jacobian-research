name: Agent JC72-108 minimality

on:
  push:
    branches:
      - agent/close-jc72-108-case1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  minimality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install replay dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends singular
          python -m pip install sympy==1.14.0
      - name: Check every one- and two-minor subsystem exactly
        shell: bash
        run: |
          python scripts/research_jc72_108_case1_rankdrop.py /tmp/base.sing
          python - <<'PY'
          from itertools import combinations
          from pathlib import Path
          base = Path('/tmp/base.sing').read_text()
          prefix = base.split('ideal K=', 1)[0]
          names = ['m12','m13','m14','m23','m24','m34']
          lines = [prefix, 'LIB "nfmodstd.lib";']
          index = 0
          for size in (1, 2):
              for subset in combinations(names, size):
                  index += 1
                  label = '_'.join(subset)
                  lines.append(f'ideal K{index}={",".join(subset)},f1;')
                  lines.append(f'ideal G{index}=nfmodStd(K{index});')
                  lines.append(f'if(size(G{index})==1 && G{index}[1]==1){{print("UNEXPECTED_EXACT_UNIT|{label}");}}else{{print("EXACT_NONUNIT|{label}");}}')
          lines.append('quit;')
          Path('/tmp/minimality.sing').write_text('\n'.join(lines) + '\n')
          PY
          set -o pipefail
          Singular -q /tmp/minimality.sing | tee exact-minimality.out
          test "$(grep -c '^EXACT_NONUNIT|' exact-minimality.out)" -eq 21
          ! grep -q '^UNEXPECTED_EXACT_UNIT|' exact-minimality.out
      - uses: actions/upload-artifact@v4
        with:
          name: exact-minimality
          path: exact-minimality.out
