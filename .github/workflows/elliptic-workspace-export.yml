name: elliptic workspace export

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/elliptic-workspace-export.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elliptic-workspace-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Package the tracked workspace
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=artifacts/local \
            --exclude=tmp \
            -czf /tmp/jacobian-workspace.tar.gz .
          sha256sum /tmp/jacobian-workspace.tar.gz | tee /tmp/jacobian-workspace.sha256
      - name: Upload the workspace snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elliptic-workspace-${{ github.sha }}
          path: |
            /tmp/jacobian-workspace.tar.gz
            /tmp/jacobian-workspace.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
