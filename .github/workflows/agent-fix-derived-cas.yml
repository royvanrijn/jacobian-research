name: Fix derived CAS dependency

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fix-derived-cas-dependency
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-jc72-108-case1
          fetch-depth: 0
      - name: Install Singular for the derived suite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/verify.yml')
          text = path.read_text()
          old = "if: ${{ matrix.suite == 'theorems' || matrix.suite == 'regressions' }}"
          new = "if: ${{ matrix.suite == 'theorems' || matrix.suite == 'regressions' || matrix.suite == 'derived' }}"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          grep -F "matrix.suite == 'derived'" .github/workflows/verify.yml
      - name: Commit the workflow correction
        shell: bash
        run: |
          set -euxo pipefail
          git rm .github/workflows/agent-fix-derived-cas.yml
          git add .github/workflows/verify.yml
          git config user.name 'openai-agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git commit -m 'Install Singular for derived verification'
          git push origin HEAD:agent/close-jc72-108-case1
