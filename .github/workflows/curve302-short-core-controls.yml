name: Curve302 short-core controls smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/curve302-short-core-controls.yml'
      - 'research/elliptic-curves/cas/curve302_short_core_controls.py'
      - 'research/elliptic-curves/cas/run_curve302_short_core_controls.py'
      - 'research/elliptic-curves/tests/test_curve302_short_core_controls.py'
permissions:
  contents: read
concurrency:
  group: curve302-short-core-controls-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/elliptic-curves/cas/curve302_short_core_controls.py
            /research/elliptic-curves/cas/run_curve302_short_core_controls.py
            /research/elliptic-curves/tests/test_curve302_short_core_controls.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install tested exact-math dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Exact arithmetic, safety, and synthetic end-to-end regressions
        run: python -m unittest discover -s research/elliptic-curves/tests -p test_curve302_short_core_controls.py -v
