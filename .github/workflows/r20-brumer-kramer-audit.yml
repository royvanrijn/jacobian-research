name: R20 Brumer-Kramer audit

on:
  push:
    branches:
      - agent/r20-brumer-kramer-audit
    paths:
      - .github/r20-brumer-kramer.patch.gz.b64
      - .github/workflows/r20-brumer-kramer-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r20-brumer-kramer-audit
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          cache: pip
      - name: Apply pinned exact-audit patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/r20-brumer-kramer.patch.gz.b64 > /tmp/r20-bk.patch.gz
          sha256sum /tmp/r20-bk.patch.gz
          gzip --decompress --stdout /tmp/r20-bk.patch.gz > /tmp/r20-bk.patch
          sha256sum /tmp/r20-bk.patch
          git apply --check /tmp/r20-bk.patch
          git apply /tmp/r20-bk.patch
          git diff --check
      - name: Install exact Python dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Generate and register exact audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=elliptic-curves/cas python \
            elliptic-curves/cas/verify_fermigier_rank20_brumer_kramer.py
          PYTHONPATH=elliptic-curves/cas python \
            elliptic-curves/cas/apply_fermigier_rank20_brumer_kramer.py
          python -m json.tool \
            artifacts/generated-results/elliptic_fermigier_rank20_brumer_kramer.json \
            >/dev/null
      - name: Replay and validate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=elliptic-curves/cas python \
            elliptic-curves/cas/verify_fermigier_rank20_brumer_kramer.py --check
          PYTHONPATH=elliptic-curves/cas python -m unittest \
            elliptic-curves/tests/test_fermigier_rank20_brumer_kramer.py \
            elliptic-curves/tests/test_finite_quotient_escape.py \
            elliptic-curves/tests/test_fermigier_rank20_candidate_record.py \
            elliptic-curves/tests/test_fermigier_generic_rank_exact.py
          python -m json.tool MATH_STATUS.json >/dev/null
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import render_status
          root=Path('.')
          index=json.loads((root/'MATH_STATUS.json').read_text())
          entries={entry['id']:entry for entry in index['entries']}
          assert 'EC-R20BK' in entries
          assert 'EC-R20BK' in entries['OP-EC-RANK-CONDUCTOR']['dependencies']
          checker=root/entries['EC-R20BK']['checker']
          assert entries['EC-R20BK']['artifact_hash']=='sha256:'+hashlib.sha256(checker.read_bytes()).hexdigest()
          assert (root/'STATUS.md').read_text()==render_status.render(index)
          artifact=json.loads((root/'artifacts/generated-results/elliptic_fermigier_rank20_brumer_kramer.json').read_text())
          assert artifact['brumer_kramer']['forced_class_group_2rank_lower_bound']==13
          assert artifact['brumer_kramer']['n']==5
          print('R20_BRUMER_KRAMER_REGISTRY_PASS')
          PY
          python scripts/check_markdown_links.py
      - name: Publish validated audit branch
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/r20-brumer-kramer.patch.gz.b64 \
            .github/workflows/r20-brumer-kramer-audit.yml
          git add \
            MATH_STATUS.json STATUS.md \
            artifacts/generated-results/elliptic_fermigier_rank20_brumer_kramer.json \
            elliptic-curves/AGENTS.md \
            elliptic-curves/README.md \
            elliptic-curves/REPRODUCE.md \
            elliptic-curves/SOURCES.md \
            elliptic-curves/cas/apply_fermigier_rank20_brumer_kramer.py \
            elliptic-curves/cas/verify_fermigier_rank20_brumer_kramer.py \
            elliptic-curves/notes/FERMIGIER_RANK20_BRUMER_KRAMER.md \
            elliptic-curves/tests/test_fermigier_rank20_brumer_kramer.py
          git diff --cached --check
          cat > /tmp/expected-paths <<'EOF'
          .github/r20-brumer-kramer.patch.gz.b64
          .github/workflows/r20-brumer-kramer-audit.yml
          MATH_STATUS.json
          STATUS.md
          artifacts/generated-results/elliptic_fermigier_rank20_brumer_kramer.json
          elliptic-curves/AGENTS.md
          elliptic-curves/README.md
          elliptic-curves/REPRODUCE.md
          elliptic-curves/SOURCES.md
          elliptic-curves/cas/apply_fermigier_rank20_brumer_kramer.py
          elliptic-curves/cas/verify_fermigier_rank20_brumer_kramer.py
          elliptic-curves/notes/FERMIGIER_RANK20_BRUMER_KRAMER.md
          elliptic-curves/tests/test_fermigier_rank20_brumer_kramer.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          git diff --cached --name-only | sort > /tmp/actual-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff --unified /tmp/expected-paths /tmp/actual-paths
          git config user.name 'OpenAI research audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prove R20 cubic 2-class-rank lower bound'
          git push origin HEAD:agent/r20-brumer-kramer-audit
