name: Curve302 chart exposure controls

on:
  push:
    paths:
      - 'research/elliptic-curves/cas/curve302_chart_exposure.py'
      - 'research/elliptic-curves/cas/run_curve302_chart_exposure.py'
      - 'research/elliptic-curves/cas/curve302_short_core_controls.py'
      - 'research/elliptic-curves/tests/test_curve302_chart_exposure.py'
      - '.github/workflows/curve302-chart-exposure.yml'
  pull_request:
    paths:
      - 'research/elliptic-curves/cas/curve302_chart_exposure.py'
      - 'research/elliptic-curves/cas/run_curve302_chart_exposure.py'
      - 'research/elliptic-curves/cas/curve302_short_core_controls.py'
      - 'research/elliptic-curves/tests/test_curve302_chart_exposure.py'
      - '.github/workflows/curve302-chart-exposure.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'sympy==1.14.0'
      - name: Exact helper and synthetic controller regressions
        env:
          PYTHONPATH: research/elliptic-curves/cas
        run: |
          python -m unittest discover \
            -s research/elliptic-curves/tests \
            -p 'test_curve302_chart_exposure.py' -v
