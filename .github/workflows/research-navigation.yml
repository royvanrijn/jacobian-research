name: Research and publication integrity

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'research/**'
      - 'results/**'
      - 'unpublished/**'
      - 'Makefile'
      - '.github/workflows/research-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate current research and exact published artifacts
        run: make check-navigation
