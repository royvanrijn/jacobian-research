name: elliptic structural groundwork

on:
  push:
    branches:
      - agent/elliptic-structural-groundwork
    paths:
      - .github/structural-groundwork.patch.gz.b64.*
      - .github/workflows/elliptic-structural-groundwork.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elliptic-structural-groundwork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/elliptic-structural-groundwork
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          cache: pip
      - name: Reconstruct and apply the pinned patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/structural-groundwork.patch.gz.b64.* \
            | base64 --decode > /tmp/structural-groundwork.patch.gz
          echo 'df2a34e71dd8cdf0ecfa8e69cee3619537c5f9eee90a3ccf1f2f7142319e6c51  /tmp/structural-groundwork.patch.gz' \
            | sha256sum --check
          gzip --decompress --stdout /tmp/structural-groundwork.patch.gz \
            > /tmp/structural-groundwork.patch
          echo '653a654b0ebbdf8171653b7da7a7100a70fd7b9a845bc78d92572fb231d59707  /tmp/structural-groundwork.patch' \
            | sha256sum --check
          git apply --check /tmp/structural-groundwork.patch
          git apply /tmp/structural-groundwork.patch
          git diff --check
      - name: Install exact replay dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pari-gp singular
          python -m pip install --requirement requirements.txt
      - name: Compile and replay structural groundwork
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            elliptic-curves/cas/finite_quotient_escape.py \
            elliptic-curves/cas/structural_search.py \
            elliptic-curves/cas/build_structural_search_groundwork.py \
            elliptic-curves/tests/test_finite_quotient_escape.py \
            elliptic-curves/tests/test_structural_search_groundwork.py
          PYTHONPATH=elliptic-curves/cas python \
            elliptic-curves/cas/build_structural_search_groundwork.py --check
          python -m json.tool \
            artifacts/generated-results/elliptic_structural_search_groundwork.json \
            >/dev/null
      - name: Replay focused structural and consolidated certificates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=elliptic-curves/cas python -m unittest \
            elliptic-curves/tests/test_finite_quotient_escape.py \
            elliptic-curves/tests/test_structural_search_groundwork.py \
            elliptic-curves/tests/test_mestre_rank13_02393128133175.py \
            elliptic-curves/tests/test_mestre_dsquare_four.py \
            elliptic-curves/tests/test_mestre_02595143168205_rank13.py \
            elliptic-curves/tests/test_fermigier_generic_rank_exact.py \
            elliptic-curves/tests/test_analyze_fermigier_exceptional_transport.py \
            elliptic-curves/tests/test_analyze_fermigier_bidegree21_pilot.py \
            elliptic-curves/tests/test_analyze_fermigier_bidegree21_all80.py \
            elliptic-curves/tests/test_fermigier_exceptional_quotient_ball.py \
            elliptic-curves/tests/test_search_fermigier_exceptional_pair_simultaneous_h200000.py \
            elliptic-curves/tests/test_search_fermigier_bidegree21_nonlinear_points.py
      - name: Check documentation and publish the validated tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_markdown_links.py
          git rm \
            .github/structural-groundwork.patch.gz.b64.* \
            .github/workflows/elliptic-structural-groundwork.yml
          git add \
            artifacts/generated-results/elliptic_structural_search_groundwork.json \
            elliptic-curves/AGENTS.md \
            elliptic-curves/README.md \
            elliptic-curves/REPRODUCE.md \
            elliptic-curves/SOURCES.md \
            elliptic-curves/cas/build_structural_search_groundwork.py \
            elliptic-curves/cas/finite_quotient_escape.py \
            elliptic-curves/cas/structural_search.py \
            elliptic-curves/notes/STRUCTURAL_SEARCH_GROUNDWORK.md \
            elliptic-curves/tests/test_finite_quotient_escape.py \
            elliptic-curves/tests/test_structural_search_groundwork.py
          git diff --cached --check
          cat > /tmp/expected-paths <<'EOF'
          .github/structural-groundwork.patch.gz.b64.00
          .github/structural-groundwork.patch.gz.b64.01
          .github/structural-groundwork.patch.gz.b64.02
          .github/structural-groundwork.patch.gz.b64.03
          .github/structural-groundwork.patch.gz.b64.04
          .github/workflows/elliptic-structural-groundwork.yml
          artifacts/generated-results/elliptic_structural_search_groundwork.json
          elliptic-curves/AGENTS.md
          elliptic-curves/README.md
          elliptic-curves/REPRODUCE.md
          elliptic-curves/SOURCES.md
          elliptic-curves/cas/build_structural_search_groundwork.py
          elliptic-curves/cas/finite_quotient_escape.py
          elliptic-curves/cas/structural_search.py
          elliptic-curves/notes/STRUCTURAL_SEARCH_GROUNDWORK.md
          elliptic-curves/tests/test_finite_quotient_escape.py
          elliptic-curves/tests/test_structural_search_groundwork.py
          EOF
          git diff --cached --name-only | sort > /tmp/actual-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff --unified /tmp/expected-paths /tmp/actual-paths
          git config user.name 'OpenAI research groundwork'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add structural elliptic-search groundwork'
          git push origin HEAD:agent/elliptic-structural-groundwork
