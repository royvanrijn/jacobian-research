name: Register JC72-108 closure chain

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: register-jc72-108-closure
  cancel-in-progress: true

jobs:
  register:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-jc72-108-case1
          fetch-depth: 0
      - name: Patch the status authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("MATH_STATUS.json")
          index = json.loads(path.read_text())
          entries = index["entries"]
          new_ids = {"PJ43A1", "PJ72Q1", "PJ72108D1"}
          entries[:] = [item for item in entries if item["id"] not in new_ids]
          by_id = {item["id"]: item for item in entries}

          kdesc = by_id["OP-KDESC"]
          if "R5K55H1 excludes" not in kdesc["scope"]:
              needle = "R5STS1 retains finer vertical/full-group calculations."
              replacement = (
                  needle
                  + " R5K55H1 excludes the first cancellable target-degree-55 "
                    "rank-five Koszul wall in the normalized two-generator family, "
                    "while leaving the third P-zero Koszul coefficient, other wall "
                    "types, and the singular-support quotient open."
              )
              assert needle in kdesc["scope"]
              kdesc["scope"] = kdesc["scope"].replace(needle, replacement)

          new_entries = [
              {
                  "id": "PJ43A1",
                  "kind": "theorem",
                  "state": "proved",
                  "title": "Exhaustive Proposition-4.3 Newton-tail audit",
                  "scope": "Exact finite lattice arithmetic reconstructs the terminal Newton-tail alternatives in the published GGV/GGHV framework. The prime-defect condition at the live (24,7) corner leaves exactly (17,5), (10,3), and (3,1), all on primitive direction (7,2); the parallelism determinants force the unique terminal endpoint assignment, while every proper proportional candidate is a collinear nonvertex. After the coordinate change t=x*y^2, z=y^(-1), the audit produces exactly the two corrected Proposition-4.3 Laurent polygons, verifies the Jacobian chain rule, and identifies the printed Case-1 point (0,1) as the typo (8,14). This certifies exhaustiveness only inside the cited published reduction.",
                  "canonical_source": "plane-jc/PROP43_EXHAUSTIVENESS_AUDIT.md",
                  "dependencies": [
                      "external: GGV/GGHV Proposition 4.1 and Proposition 4.3"
                  ],
                  "checker": "plane-jc/cas/verify_prop43_exhaustiveness.py",
                  "proof_type": "exact_symbolic",
                  "independent_replay": True,
                  "formal_verification": False,
                  "external_review": False,
                  "artifact_hash": "sha256:f9c7d1d7f8b3e0b2beedf0a2f4d0534b1b88eecf002e598ac0f0e5595a435137",
                  "software_lock": [".python-version", "requirements.txt"],
                  "supersedes_notes": [
                      "an unaudited assumption that Proposition 4.3 listed every terminal Newton branch"
                  ],
                  "supersedes": [],
                  "closes_problems": [],
                  "narrows_problems": [],
                  "consumers": ["PJ72Q1", "PJ1", "OP-PLANE"],
                  "invalidates_assumptions": [],
                  "replaced_by": [],
                  "priority": "reference"
              },
              {
                  "id": "PJ72Q1",
                  "kind": "theorem",
                  "state": "proved",
                  "title": "Intrinsic mu-seven quotient of the first Wronskian block",
                  "scope": "For the two corrected Laurent systems isolated by PJ43A1, the residual mu_7 action shows that the archived degree-35 first-block presentation is a rank-seven pullback of an intrinsic degree-five quotient. Exact descent reproduces all eleven triangular solves, the six obstruction equations in degrees 13 through 18, their q-valuations, and the complete quotient graph coefficient by coefficient. The quotient eliminant has degree five, so the first block and the later Case-1 coefficient field can be reconstructed without treating the degree-35 presentation as intrinsic.",
                  "canonical_source": "plane-jc/JC2_72_108_DETERMINANTAL_CLOSURE.md",
                  "dependencies": ["PJ43A1"],
                  "checker": "plane-jc/cas/verify_mu7_quotient_firstblock.py",
                  "proof_type": "exact_symbolic",
                  "independent_replay": True,
                  "formal_verification": False,
                  "external_review": False,
                  "artifact_hash": "sha256:f1638af742ad6552a151e8991a48811208c43f0322cf427160ae6ee712779e2e",
                  "software_lock": [".python-version", "requirements.txt"],
                  "supersedes_notes": [
                      "the degree-35 first-block coefficient field as an intrinsic presentation"
                  ],
                  "supersedes": [],
                  "closes_problems": [],
                  "narrows_problems": [],
                  "consumers": ["PJ72108D1", "PJ1", "OP-PLANE"],
                  "invalidates_assumptions": [],
                  "replaced_by": [],
                  "priority": "reference"
              },
              {
                  "id": "PJ72108D1",
                  "kind": "theorem",
                  "state": "proved",
                  "title": "Determinantal closure of the Case-1 (72,108) Laurent system",
                  "scope": "Building on the corrected quotient systems certified by PJ72Q1 and the Case-1 cover skeleton of LBC1, work over the exact quintic field L=QQ[w]/(w^5-w^4+3*w^3+3*w^2+26). On each sign branch the four hard residuals have F_i=h*b_i+a_i*N. With m_ij=a_i*b_j-a_j*b_i, exact characteristic-zero standard-basis arithmetic proves (m_12,m_23,m_34,F_1)=L[h,u_1,u_2]. The syzygies a_i*F_j-a_j*F_i=h*m_ij imply h is in (F_1,F_2,F_3,F_4), while an exact special-fibre Bezout identity for a_1,a_2 implies N is in that ideal. Hence (F_1,F_2,F_3,F_4)=(h,N), and the existing exact h=N=0 unit certificates exclude both sign branches. This replaces the opaque 89 MB h-membership certificate by a codimension-two determinantal argument. It is a theorem about the two audited Laurent systems, not a stand-alone proof of the general plane degree reduction.",
                  "canonical_source": "plane-jc/JC2_72_108_DETERMINANTAL_CLOSURE.md",
                  "dependencies": ["PJ72Q1", "LBC1"],
                  "checker": "scripts/research_jc72_108_case1_rankdrop.py",
                  "proof_type": "exact_symbolic",
                  "independent_replay": True,
                  "formal_verification": False,
                  "external_review": False,
                  "artifact_hash": "sha256:0ade2f15186aa6232a6da376bed17ef6fc56c12b04b56b421076527d7d78561d",
                  "software_lock": [".python-version", "requirements.txt"],
                  "supersedes_notes": [
                      "the opaque 89 MB Case-1 h-membership certificate as the only replay route"
                  ],
                  "supersedes": [],
                  "closes_problems": [],
                  "narrows_problems": [],
                  "consumers": ["PJ1", "OP-PLANE"],
                  "invalidates_assumptions": [],
                  "replaced_by": [],
                  "priority": "reference"
              }
          ]

          pj1_index = next(i for i, item in enumerate(entries) if item["id"] == "PJ1")
          entries[pj1_index:pj1_index] = new_entries
          by_id = {item["id"]: item for item in entries}

          pj1 = by_id["PJ1"]
          pj1["scope"] = (
              "PJ43A1 proves that the audited terminal Newton tail has exactly the two "
              "corrected Proposition-4.3 Laurent systems; PJ72Q1 reconstructs their "
              "intrinsic degree-five first block; RSE3 excludes every Case-2 cover row; "
              "and PJ72108D1 excludes both Case-1 sign branches by proving the hard ideal "
              "is (h,N). Conditional on the published minimal/standard normal-form "
              "reductions and degree classification, any plane counterexample therefore "
              "has larger coordinate degree at least 125. This does not prove JC(2) or "
              "attainability of degree 125."
          )
          pj1["dependencies"] = [
              "PJ43A1",
              "PJ72Q1",
              "RSE3",
              "PJ72108D1",
              "external: published minimal/standard normal-form reductions and degree classification"
          ]

          rse3 = by_id["RSE3"]
          if "PJ1" not in rse3["consumers"]:
              rse3["consumers"].append("PJ1")

          plane = by_id["OP-PLANE"]
          plane["scope"] = (
              "PJ43A1, PJ72Q1, RSE3, and PJ72108D1 close the audited "
              "(72,108)/(108,72) row and leave the conditional larger-coordinate frontier "
              "at 125. Advance the plane-Jacobian programme beyond 125 by deriving the "
              "next exhaustive Laurent branches and nested positive branch scales, "
              "applying the log-boundary compiler, and quotienting any matching "
              "three-band Poisson-square block by its reduced classification before "
              "coefficient elimination."
          )
          for dependency in ("PJ43A1", "PJ72Q1", "PJ72108D1"):
              if dependency not in plane["dependencies"]:
                  plane["dependencies"].append(dependency)

          lbc1 = by_id["LBC1"]
          old = (
              "The chain-to-boundary gap is closed; only the three Case-1 cover rows "
              "remain for the conceptual replacement program."
          )
          new = (
              "The chain-to-boundary gap is closed. PJ72108D1 subsequently eliminates "
              "the three Case-1 cover rows by a quotient-first determinantal argument, "
              "so they no longer remain as a frontier obstruction."
          )
          if old in lbc1["scope"]:
              lbc1["scope"] = lbc1["scope"].replace(old, new)
          else:
              assert "PJ72108D1" in lbc1["scope"]

          path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + "\n")
          PY
      - name: Render and validate the status registry
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/render_status.py
          python scripts/audit_status.py
          python scripts/check_markdown_links.py
      - name: Commit the permanent registry update
        shell: bash
        run: |
          set -euxo pipefail
          git rm .github/workflows/agent-jc72-108-status.yml
          git add MATH_STATUS.json STATUS.md
          git config user.name 'openai-agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git commit -m 'Register the JC72-108 closure chain'
          git push origin HEAD:agent/close-jc72-108-case1
