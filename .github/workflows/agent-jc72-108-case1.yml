name: Agent JC72-108 Case 1

on:
  push:
    branches:
      - agent/close-jc72-108-case1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rankdrop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install exact replay dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends singular
          python -m pip install sympy==1.14.0
      - name: Replay the finite-field determinantal identity
        shell: bash
        run: |
          python scripts/research_jc72_108_case1_rankdrop.py /tmp/case1-rankdrop-p71.sing --prime 71 --lift
          set -o pipefail
          Singular -q /tmp/case1-rankdrop-p71.sing | tee case1-rankdrop-p71.out
          grep -q '^RANKDROP_UNIT_IDENTITY_PASS$' case1-rankdrop-p71.out
          grep -q '^CASE1_H_DETERMINANTAL_PASS$' case1-rankdrop-p71.out
      - name: Prove the rank-drop unit ideal in characteristic zero
        shell: bash
        run: |
          python scripts/research_jc72_108_case1_rankdrop.py /tmp/case1-rankdrop-exact.sing
          set -o pipefail
          timeout 1200 Singular -q /tmp/case1-rankdrop-exact.sing | tee case1-rankdrop-exact.out
          grep -q '^RANKDROP_EXACT_UNIT_PASS$' case1-rankdrop-exact.out
      - uses: actions/upload-artifact@v4
        with:
          name: case1-rankdrop-replay
          path: |
            case1-rankdrop-p71.out
            case1-rankdrop-exact.out
