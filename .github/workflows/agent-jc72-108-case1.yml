name: Agent JC72-108 Case 1

on:
  push:
    branches:
      - agent/close-jc72-108-case1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install replay dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends singular
          python -m pip install sympy==1.14.0
      - name: Lift the adjacent-minor identity exactly
        shell: bash
        run: |
          python scripts/research_jc72_108_case1_rankdrop.py /tmp/case1-exact-base.sing
          python - <<'PY'
          from pathlib import Path
          base = Path('/tmp/case1-exact-base.sing').read_text()
          prefix = base.split('ideal K=', 1)[0]
          lines = [prefix,
              'ideal K=m12,m23,m34,f1;',
              'matrix T; ideal G=liftstd(K,T);',
              'int jj=0; int k; for(k=1;k<=size(G);k++){if(G[k]==1||G[k]==-1){jj=k;}}',
              'if(jj==0){print("MINIMAL_EXACT_LIFT_FAIL"); quit;}',
              'if(G[jj]==-1){for(k=1;k<=nrows(T);k++){T[k,jj]=-T[k,jj];}}',
              'poly check1=0; for(k=1;k<=4;k++){check1=check1+K[k]*T[k,jj];}',
              'if(check1==1){print("MINIMAL_EXACT_UNIT_IDENTITY_PASS");}else{print("MINIMAL_EXACT_UNIT_IDENTITY_FAIL");}',
              'poly c12=T[1,jj]; poly c23=T[2,jj]; poly c34=T[3,jj]; poly d=T[4,jj];',
              'poly t1=h*d-c12*a2;',
              'poly t2=c12*a1-c23*a3;',
              'poly t3=c23*a2-c34*a4;',
              'poly t4=c34*a3;',
              'poly checkh=t1*f1+t2*f2+t3*f3+t4*f4;',
              'if(checkh==h){print("MINIMAL_EXACT_H_IDENTITY_PASS");}else{print("MINIMAL_EXACT_H_IDENTITY_FAIL");}',
              'print("C12_TERMS="+string(size(c12))); print("C23_TERMS="+string(size(c23))); print("C34_TERMS="+string(size(c34))); print("D_TERMS="+string(size(d)));',
              'print("T1_TERMS="+string(size(t1))); print("T2_TERMS="+string(size(t2))); print("T3_TERMS="+string(size(t3))); print("T4_TERMS="+string(size(t4)));',
              'write("case1-minimal-exact-certificate.txt","C12="+string(c12)+";\\nC23="+string(c23)+";\\nC34="+string(c34)+";\\nD="+string(d)+";\\n");',
              'quit;']
          Path('/tmp/case1-minimal-exact-lift.sing').write_text('\n'.join(lines) + '\n')
          PY
          set -o pipefail
          timeout 900 Singular -q /tmp/case1-minimal-exact-lift.sing | tee case1-minimal-exact-lift.out
          grep -q '^MINIMAL_EXACT_UNIT_IDENTITY_PASS$' case1-minimal-exact-lift.out
          grep -q '^MINIMAL_EXACT_H_IDENTITY_PASS$' case1-minimal-exact-lift.out
          wc -c case1-minimal-exact-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: case1-minimal-exact-lift
          path: |
            case1-minimal-exact-lift.out
            case1-minimal-exact-certificate.txt
