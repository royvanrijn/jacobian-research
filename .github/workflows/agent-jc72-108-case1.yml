name: Agent JC72-108 Case 1

on:
  push:
    branches:
      - agent/close-jc72-108-case1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rankdrop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends singular
      - name: Probe the compatible Case 1 rank-drop locus
        shell: bash
        run: |
          set -o pipefail
          Singular -q plane-jc/research/jc72_108_case1_rankdrop_p71.sing | tee case1-rankdrop-p71.out
      - uses: actions/upload-artifact@v4
        with:
          name: case1-rankdrop-p71
          path: case1-rankdrop-p71.out
