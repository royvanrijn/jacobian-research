name: Agent JC72-108 Case 1

on:
  push:
    branches:
      - agent/close-jc72-108-case1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install replay dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends singular
          python -m pip install sympy==1.14.0
      - name: Test all minimal triples in characteristic zero
        shell: bash
        run: |
          python scripts/research_jc72_108_case1_rankdrop.py /tmp/case1-exact-base.sing
          python - <<'PY'
          from pathlib import Path
          base = Path('/tmp/case1-exact-base.sing').read_text()
          prefix = base.split('ideal K=', 1)[0]
          triples = [
              ('m12','m23','m34'),
              ('m12','m24','m34'),
              ('m13','m23','m24'),
              ('m13','m24','m34'),
              ('m14','m23','m24'),
              ('m14','m23','m34'),
          ]
          lines = [prefix, 'LIB "nfmodstd.lib";']
          for index, triple in enumerate(triples, 1):
              label = '_'.join(triple)
              lines.append(f'ideal K{index}={",".join(triple)},f1;')
              lines.append(f'ideal G{index}=nfmodStd(K{index});')
              lines.append(f'if(size(G{index})==1 && G{index}[1]==1){{print("EXACT_UNIT|{label}");}}else{{print("EXACT_NONUNIT|{label}");}}')
          lines.append('quit;')
          Path('/tmp/case1-exact-triples.sing').write_text('\n'.join(lines) + '\n')
          PY
          set -o pipefail
          Singular -q /tmp/case1-exact-triples.sing | tee case1-exact-triples.out
          test "$(grep -c '^EXACT_UNIT|' case1-exact-triples.out)" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: case1-exact-triples
          path: case1-exact-triples.out
