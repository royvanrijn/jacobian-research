name: Agent JC72-108 Case 1

on:
  push:
    branches:
      - agent/close-jc72-108-case1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Package exact Case 1 inputs
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=plane-jc/external/zenodo-21479814/bilLkarkariy-jc2-72-108-exact-certificates-d9ea4fd/release_bundle
          find "$ROOT" -maxdepth 4 -type f -printf '%P\t%s bytes\n' | sort | tee case1-file-list.txt
          tar \
            --exclude='exact_replay/hard/h_certificate_exact.txt' \
            --exclude='exact_replay/hard/h_solution_exact.pkl' \
            --exclude='jc2_72_108_exact_replay_v1.0.1.zip' \
            -czf case1-source.tgz \
            -C "$ROOT" exact_replay
      - uses: actions/upload-artifact@v4
        with:
          name: case1-source
          path: |
            case1-file-list.txt
            case1-source.tgz
