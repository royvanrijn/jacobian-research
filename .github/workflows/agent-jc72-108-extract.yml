name: Agent JC72-108 extract

on:
  push:
    branches:
      - agent/close-jc72-108-case1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-jc72-108-case1
          fetch-depth: 0
      - name: Reassemble and verify the closure bundle
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            .agent-jc72-payload/chunk-00 \
            .agent-jc72-payload/chunk-01 \
            .agent-jc72-payload/chunk-02 \
            .agent-jc72-payload/chunk-03-00 \
            .agent-jc72-payload/chunk-03-01 \
            .agent-jc72-payload/chunk-03-02 \
            .agent-jc72-payload/chunk-04-00 \
            .agent-jc72-payload/chunk-04-01 \
            .agent-jc72-payload/chunk-04-02 \
            .agent-jc72-payload/chunk-05-00 \
            .agent-jc72-payload/chunk-05-01 \
            .agent-jc72-payload/chunk-05-02 \
            > /tmp/jc72-closure.tar.gz
          echo 'ae26ead60b4c5e95fa1f334701eaaabb99f5e024f87fb9f2b6f90067135cbd8a  /tmp/jc72-closure.tar.gz' | sha256sum --check
          tar -xzf /tmp/jc72-closure.tar.gz -C .
          chmod +x scripts/research_jc72_108_case1_rankdrop.py plane-jc/cas/*.py
          cat > /tmp/jc72-files.sha256 <<'EOF'
          128c04033262c813c0a3aee1e01c2333e49df1b246bee84f4936a7c0020ab114  ./plane-jc/JC2_72_108_DETERMINANTAL_CLOSURE.md
          484a08c86c8e35c316b5ccea359b998541b01406a6e32048add38dd925266435  ./plane-jc/PROP43_EXHAUSTIVENESS_AUDIT.md
          2e9b16f5c094cc44a3c7ea0696c0b8795330bf891d709c76e8d37f67a0a6a61e  ./plane-jc/cas/firstblock_mu7_quotient_equations.txt
          5e6524406183886174fe2f2e1d981c171293f38d888be5bd130e74326e338997  ./plane-jc/cas/firstblock_mu7_quotient_lex_basis.txt
          5cc365399e475636d44bd3dcd8bad43ac8f62f263702d85d43c4afdce6b98a2b  ./plane-jc/cas/research_72_108_gap_attack.py
          a0a749945fa782d36d5e019491a9a4e476701a0dc17fbff93ddd41b548bb70bb  ./plane-jc/cas/verify_firstblock_quotient_graph.py
          f1638af742ad6552a151e8991a48811208c43f0322cf427160ae6ee712779e2e  ./plane-jc/cas/verify_mu7_quotient_firstblock.py
          8a9f683a6f1c3ecde3cc3c41788fe2276ba1a89bab232a2ad2e0884afa78e03f  ./plane-jc/cas/verify_prime_defect_tail.py
          f9c7d1d7f8b3e0b2beedf0a2f4d0534b1b88eecf002e598ac0f0e5595a435137  ./plane-jc/cas/verify_prop43_exhaustiveness.py
          0ade2f15186aa6232a6da376bed17ef6fc56c12b04b56b421076527d7d78561d  ./scripts/research_jc72_108_case1_rankdrop.py
          EOF
          sha256sum --check /tmp/jc72-files.sha256
      - name: Install exact replay dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends singular
          python -m pip install sympy==1.14.0
      - name: Replay the front end and quotient-first reductions
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile \
            plane-jc/cas/verify_prop43_exhaustiveness.py \
            plane-jc/cas/verify_prime_defect_tail.py \
            plane-jc/cas/verify_mu7_quotient_firstblock.py \
            plane-jc/cas/research_72_108_gap_attack.py \
            plane-jc/cas/verify_firstblock_quotient_graph.py \
            scripts/research_jc72_108_case1_rankdrop.py
          python plane-jc/cas/verify_prop43_exhaustiveness.py | tee /tmp/prop43.out
          grep -q '^PROP43_EXHAUSTIVENESS_AUDIT_PASS$' /tmp/prop43.out
          python plane-jc/cas/verify_prime_defect_tail.py | tee /tmp/prime-defect.out
          grep -q '^PRIME_DEFECT_TAIL_PASS$' /tmp/prime-defect.out
          python plane-jc/cas/verify_mu7_quotient_firstblock.py | tee /tmp/mu7.out
          grep -q '^MU7_QUOTIENT_FIRSTBLOCK_PASS$' /tmp/mu7.out
          python plane-jc/cas/research_72_108_gap_attack.py | tee /tmp/structure.out
          grep -q '^ALL_72_108_GAP_ATTACK_CHECKS_PASS$' /tmp/structure.out
          python plane-jc/cas/verify_firstblock_quotient_graph.py | tee /tmp/quotient-graph.out
          grep -q '^FIRSTBLOCK_QUOTIENT_GRAPH_PASS$' /tmp/quotient-graph.out
      - name: Replay the exact Case-1 determinant proof
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/research_jc72_108_case1_rankdrop.py /tmp/case1-exact.sing | tee /tmp/case1-generate.out
          grep -q '^CASE1_RECONSTRUCTION_PASS$' /tmp/case1-generate.out
          grep -q '^CASE1_SPECIAL_FIBRE_PYTHON_PASS$' /tmp/case1-generate.out
          Singular -q /tmp/case1-exact.sing | tee /tmp/case1-exact.out
          grep -q '^CASE1_SPECIAL_FIBRE_BEZOUT_PASS$' /tmp/case1-exact.out
          grep -q '^CASE1_N_MOD_H_PASS$' /tmp/case1-exact.out
          grep -q '^RANKDROP_EXACT_UNIT_PASS$' /tmp/case1-exact.out
          python scripts/research_jc72_108_case1_rankdrop.py /tmp/case1-p71.sing --prime 71 --lift
          Singular -q /tmp/case1-p71.sing | tee /tmp/case1-p71.out
          grep -q '^RANKDROP_UNIT_IDENTITY_PASS$' /tmp/case1-p71.out
          grep -q '^CASE1_H_DETERMINANTAL_PASS$' /tmp/case1-p71.out
      - name: Commit only the permanent closure artifacts
        shell: bash
        run: |
          set -euxo pipefail
          git rm -rf --ignore-unmatch \
            .agent-jc72-payload \
            .github/workflows/agent-jc72-108-case1.yml \
            .github/workflows/agent-jc72-108-minimality.yml \
            .github/workflows/agent-jc72-108-ledger.yml \
            .github/workflows/agent-jc72-108-extract.yml \
            plane-jc/research/jc72_108_case1_minors_p71.sing \
            plane-jc/research/jc72_108_case1_rankdrop_p71.sing
          git add \
            plane-jc/JC2_72_108_DETERMINANTAL_CLOSURE.md \
            plane-jc/PROP43_EXHAUSTIVENESS_AUDIT.md \
            plane-jc/cas/firstblock_mu7_quotient_equations.txt \
            plane-jc/cas/firstblock_mu7_quotient_lex_basis.txt \
            plane-jc/cas/research_72_108_gap_attack.py \
            plane-jc/cas/verify_firstblock_quotient_graph.py \
            plane-jc/cas/verify_mu7_quotient_firstblock.py \
            plane-jc/cas/verify_prime_defect_tail.py \
            plane-jc/cas/verify_prop43_exhaustiveness.py \
            scripts/research_jc72_108_case1_rankdrop.py
          git config user.name 'openai-agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git commit -m 'Close the JC72-108 determinant gap'
          git push origin HEAD:agent/close-jc72-108-case1
